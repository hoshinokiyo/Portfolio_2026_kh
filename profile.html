<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>profile</title>
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div class="page">
    <div class="top-nav">Top / Logout</div>
    <h1 class="title">Admin Demo</h1>
    <div class="container">
      <div class="top-row">
        <div class="section messages">
          <h2>Messages</h2>
          <div class="site-block">
            <div class="site-name">Site A</div>
            <div class="site-stats">
              <div class="stat">New 3</div>
              <div class="stat">Reply 2</div>
              <div class="stat">Schedule 1</div>
              <div class="stat">Profile 1</div>
            </div>
          </div>
          <div class="site-block">
            <div class="site-name">Site B</div>
            <div class="site-stats">
              <div class="stat">New 4</div>
              <div class="stat">Reply 1</div>
              <div class="stat">Schedule 2</div>
              <div class="stat">Profile 3</div>
            </div>
          </div>
          <div class="site-block">
            <div class="site-name">Site C</div>
            <div class="site-stats">
              <div class="stat">New 2</div>
              <div class="stat">Reply 5</div>
              <div class="stat">Schedule 1</div>
              <div class="stat">Profile 2</div>
            </div>
          </div>
        </div>
        <div class="section calendar">
          <h2>Calendar</h2>
          <div class="calendar-list">
            <div class="calendar-item tentative">
              <div class="calendar-date">May 10</div>
              <div class="calendar-info">
                <div class="calendar-time">14:00 Tamura</div>
                <div class="calendar-status">Tentative</div>
              </div>
            </div>
            <div class="calendar-item confirmed">
              <div class="calendar-date">May 12</div>
              <div class="calendar-info">
                <div class="calendar-time">11:00 Yamamoto</div>
                <div class="calendar-status">Confirmed</div>
              </div>
            </div>
            <div class="calendar-item tentative">
              <div class="calendar-date">May 15</div>
              <div class="calendar-info">
                <div class="calendar-time">16:30 Mori</div>
                <div class="calendar-status">Tentative</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="section ai">
        <h2>AI Matching</h2>
      </div>
    </div>
  </div>
</body>
</html>
